# GitHub Actions workflow to build and deploy a Node.js app to Azure Web Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: gbase1          # Your Azure Web App name
  NODE_VERSION: '20.x'               # Node.js version

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
          npm run test --if-present

      # Upload build folder as artifact (actual path)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./dist  # Make sure your build outputs to ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: 'https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net'

    steps:
      # Download artifact
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy  # Download artifact to ./deploy folder

      # Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy  # Deploy from downloaded artifact folder
